<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#c60067">
  <title>Sunoida · Guide Assistant</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/styles.css?v=chat-tools">
  <script src="/assets/inline-pages.js?v=chat-tools" defer></script>
</head>
<body>
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M12 19V5m-6 6 6-6 6 6"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 5c-3-2-6-2-9-1v15c3-1 6-1 9 1m0-15c3-2 6-2 9-1v15c-3-1-6-1-9 1V5Z"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 3h7v7m0-7-11 11M10 4H4v16h16v-6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V3H3v13h5"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.5"/><path d="m3 17 6-6 4 4 3-3 5 5"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="m13 3 8 8-4 1-3 5-7-7 5-3 1-4ZM10 14l-6 6"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="5.5"/><path d="m15 15 5 5"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 3 2.6 6.4L21 12l-6.4 2.6L12 21l-2.6-6.4L3 12l6.4-2.6L12 3Z"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6l8-3Z"/><path d="m8 12 3 3 5-6"/></symbol>
  </svg>

  <button id="drawer-backdrop" class="drawer-backdrop" aria-label="Close chat history" hidden></button>
  <aside id="sidebar" class="sidebar" aria-labelledby="history-heading">
    <div class="history-heading">
      <h2 id="history-heading">Chats</h2>
      <button id="close-history" class="icon-button mobile-menu" type="button" aria-label="Close chat history"><svg class="icon"><use href="#i-close"/></svg></button>
    </div>
    <button id="new-chat" class="new-chat" type="button"><svg class="icon"><use href="#i-plus"/></svg> New chat</button>
    <label class="history-search" for="chat-search">
      <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
      <span class="sr-only">Search chats</span>
      <input id="chat-search" type="search" placeholder="Search chats" autocomplete="off">
    </label>
    <nav id="chat-history" class="chat-history" aria-label="Previous chats"></nav>
    <p id="history-status" class="history-status" role="status"></p>
  </aside>

  <main id="workspace" class="workspace is-empty">
    <header class="topbar">
      <div class="topbar-title"><strong>Sunoida<span class="brand-dot">.</span></strong><span>Guide Assistant</span></div>
      <div class="toolbar-actions">
        <button id="export-chat" class="toolbar-button" type="button" aria-label="Export chat" disabled><svg class="icon"><use href="#i-download"/></svg><span>Export chat</span></button>
        <button id="menu-toggle" class="icon-button mobile-menu" type="button" aria-label="Open chat history" aria-controls="sidebar" aria-expanded="false"><svg class="icon"><use href="#i-menu"/></svg></button>
      </div>
    </header>

    <div id="conversation-scroll" class="conversation-scroll">
      <section id="messages" class="messages" role="log" aria-label="Conversation" aria-live="polite"></section>
    </div>

    <div class="composer-area"><div class="composer-wrap">
      <form id="chat-form" class="composer">
        <label class="sr-only" for="message">Ask a question about your Sunoida guides</label>
        <textarea id="message" rows="2" maxlength="2000" placeholder="Ask anything about your Sunoida guides…" required></textarea>
        <div class="composer-bottom">
          <div class="guide-control">
            <label class="guide-picker" for="guide-select"><svg class="icon" aria-hidden="true"><use href="#i-book"/></svg><span class="sr-only">Search guide</span><select id="guide-select" disabled><option value="">All product guides</option></select></label>
            <button id="open-guide" class="icon-button" type="button" aria-label="Open selected guide" title="Open selected guide" hidden><svg class="icon"><use href="#i-external"/></svg></button>
          </div>
          <div class="composer-actions"><span id="character-count">0 / 2000</span><button id="send" type="submit" class="send-button" aria-label="Send question" disabled><svg class="icon"><use href="#i-arrow"/></svg></button></div>
        </div>
      </form>
      <div class="composer-footer"><p>Answers can make mistakes. Check the retrieved guide pages.</p><span>Enter to send · Shift + Enter for a new line</span></div>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </div></div>
  </main>

  <dialog id="chat-tools" class="chat-tools" aria-labelledby="chat-tools-heading">
    <div class="chat-tools-header">
      <h2 id="chat-tools-heading">Chat options</h2>
      <button id="close-chat-tools" class="icon-button" type="button" aria-label="Close chat options"><svg class="icon"><use href="#i-close"/></svg></button>
    </div>
    <p id="chat-tools-name" class="chat-tools-name"></p>
    <div id="chat-tools-actions" class="chat-tools-actions">
      <button id="pin-chat" type="button">Pin chat</button>
      <button id="rename-chat" type="button">Rename chat</button>
      <button id="share-chat" type="button">Share chat</button>
      <button id="download-saved-chat" type="button">Download transcript</button>
      <button id="delete-chat" class="danger" type="button">Delete chat</button>
    </div>
    <form id="chat-rename-form" class="chat-tool-panel" hidden>
      <label for="chat-name">Chat title</label>
      <input id="chat-name" maxlength="120" required>
      <div class="chat-tool-buttons"><button class="chat-tool-back" type="button">Back</button><button class="primary" type="submit">Save title</button></div>
    </form>
    <div id="chat-share-panel" class="chat-tool-panel" hidden>
      <label for="chat-share-text">Transcript to share</label>
      <textarea id="chat-share-text" rows="8" readonly></textarea>
      <div class="chat-tool-buttons"><button class="chat-tool-back" type="button">Back</button><button id="share-native" type="button" hidden>Share via device</button><button id="copy-chat" class="primary" type="button">Copy transcript</button></div>
    </div>
    <div id="chat-delete-panel" class="chat-tool-panel" hidden>
      <p>This permanently removes the transcript from this browser.</p>
      <div class="chat-tool-buttons"><button class="chat-tool-back" type="button">Cancel</button><button id="confirm-delete-chat" class="danger-fill" type="button">Delete chat</button></div>
    </div>
    <p id="chat-tools-status" class="history-status" role="status"></p>
  </dialog>

  <dialog id="page-dialog" class="page-dialog" aria-labelledby="preview-title">
    <div class="preview-toolbar"><div><span id="preview-kind" class="eyebrow">ORIGINAL GUIDE PAGE</span><h2 id="preview-title"></h2></div><button id="close-preview" class="icon-button" aria-label="Close page preview"><svg class="icon"><use href="#i-close"/></svg></button></div>
    <div id="preview-scroll" class="preview-scroll"><p id="preview-status" role="status">Loading page…</p><img id="page-image" alt=""></div>
    <div class="preview-footer"><div class="page-controls"><button id="previous-page" class="icon-button" aria-label="Previous page"><svg class="icon rotate"><use href="#i-chevron"/></svg></button><span id="page-position"></span><button id="next-page" class="icon-button" aria-label="Next page"><svg class="icon"><use href="#i-chevron"/></svg></button></div><a id="open-pdf" class="pdf-link" target="_blank" rel="noopener">Open PDF <svg class="icon"><use href="#i-external"/></svg></a></div>
  </dialog>
</body>
</html>
